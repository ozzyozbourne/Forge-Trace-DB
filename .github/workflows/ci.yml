name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  s3:
    # S3 path (segments, sidecars, object-store WAL) against an S3-compatible mock.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python3 -m venv /tmp/moto && /tmp/moto/bin/pip install "moto[server]"
      - run: |
          /tmp/moto/bin/moto_server -p 5555 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:5555/ >/dev/null && break; sleep 1; done
          curl -X PUT http://127.0.0.1:5555/forge-test
      - run: cargo test -p forge-server --test s3
        env:
          FORGE_TEST_S3_ENDPOINT: http://127.0.0.1:5555

  bench:
    # Builds the criterion benches and records end-to-end numbers for this commit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --no-run -p forge-model -p forge-index
      - run: cargo build --release -p forge-cli
      - name: forge bench
        run: |
          {
            echo '### forge bench (GitHub runner, local disk)'
            echo '```'
            ./target/release/forge bench ingest --traces 2000 --spans-per-trace 50
            ./target/release/forge bench query --traces 2000 --spans-per-trace 50 --big-trace-spans 2000 --iterations 20 --compact
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
